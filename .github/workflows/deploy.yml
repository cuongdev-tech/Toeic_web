name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/mydb"
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/mydb"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build:fe

  deploy-render:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_HOOK != ''
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-railway:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RAILWAY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Railway deploy
        if: env.RAILWAY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}"